[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pointcloud-playground"
version = "1.0.0"
description = "Reproducible point-cloud experiments with quantitative evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "cab0a" }]
keywords = [
    "3d-data-processing",
    "computer-vision",
    "point-cloud",
    "reproducibility",
    "research",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]
data = ["laspy[lazrs]>=2.5"]

[project.urls]
Changelog = "https://github.com/cab0a/pointcloud-playground/blob/main/CHANGELOG.md"
Documentation = "https://github.com/cab0a/pointcloud-playground#readme"
Issues = "https://github.com/cab0a/pointcloud-playground/issues"
Repository = "https://github.com/cab0a/pointcloud-playground"

[project.scripts]
pointcloud-playground = "pointcloud_playground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
