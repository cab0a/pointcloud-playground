name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run tests
        run: python -m pytest

      - name: Run README Quick Start
        if: matrix.python-version == '3.12'
        run: |
          quick_start_root="$(mktemp -d)"
          cd "${quick_start_root}"
          pointcloud-playground generate-demo demo.xyz
          pointcloud-playground evaluate-joint-sensitivity demo.xyz \
            --output-dir output/joint_sensitivity
          test -s demo.xyz
          test -s output/joint_sensitivity/metrics.csv
          test -s output/joint_sensitivity/comparison.png

      - name: Build distribution
        run: python -m build

      - name: Check wheel installation and CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          pointcloud-playground --version
          pointcloud-playground --help
